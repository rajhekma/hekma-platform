worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Upstreams: monoliths on the host (start them separately)
    upstream python_monolith {
        server host.docker.internal:8000;
    }

    upstream java_monolith {
        server host.docker.internal:8080;
    }

    # Future: hekma-clinical-scanner on host port 8011
    upstream clinical_scanner {
        server host.docker.internal:8011;
    }

    upstream ai_usage {
        server ai-usage:8090;
    }

    server {
        listen 80;
        server_name localhost;

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"hekma-platform"}';
        }

        # Patient AI usage (hekma-platform/ai-usage)
        location /v1/patients/ {
            proxy_pass http://ai_usage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/ai-cost/ {
            proxy_pass http://ai_usage;
            proxy_set_header Host $host;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header Authorization $http_authorization;
        }

        location /internal/v1/ai-usage/ {
            proxy_pass http://ai_usage;
            proxy_set_header Host $host;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # MS-11 — route here when hekma-clinical-scanner is running
        location ~ ^/api/patients/[^/]+/clinical-scans {
            proxy_pass http://clinical_scanner;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # Python data pipeline (default patient/clinical APIs)
        location /api/ {
            proxy_pass http://python_monolith;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/(patient|patientheader|patientdetail|fastenhealth|healthkit) {
            proxy_pass http://python_monolith;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Java CTMS / GraphQL / auth
        location /graphql {
            proxy_pass http://java_monolith;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/(login|auth|session|signup|forgetpassword|api/v1/support|webhook) {
            proxy_pass http://java_monolith;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            default_type text/plain;
            return 200 'Hekma API Gateway\nUse /health, /graphql, /api/*\n';
        }
    }
}
