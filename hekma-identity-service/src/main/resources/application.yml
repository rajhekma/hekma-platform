spring:
  application:
    name: hekma-identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hekma_platform}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: ${FLYWAY_TABLE:identity_flyway_schema_history}
    baseline-on-migrate: true
    baseline-version: 0

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
      path: /graphiql
    schema:
      introspection:
        enabled: ${GRAPHQL_INTROSPECTION_ENABLED:true}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
  mock-mode: ${FIREBASE_MOCK_MODE:false}
  web-api-key: ${FIREBASE_WEB_API_KEY:AIzaSyD9seuJi019lcrMaijci2CwkvgekSMpUro}

app:
  system-admin:
    email: ${SYSTEM_ADMIN_EMAIL:system.admin@hekma.com}
    display-name: "System Administrator"
    enabled: true
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:admin@hekma.com}
    display-name: "Platform Administrator"
    enabled: true
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
    # Defaults to shared dev key matching hekma-notification-service. Override in production.
    service-key: ${NOTIFICATION_SERVICE_KEY:13f8fc11-b3b5-4a9e-ab49-06e96a57f42b}
  security:
    cors:
      # Comma-separated list of browser origins allowed to call this API.
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    # Exposes Swagger UI / OpenAPI docs without authentication. Keep false in production.
    expose-api-docs: ${APP_EXPOSE_API_DOCS:false}
  otp:
    # Echoes plaintext OTPs to the console for local development only. PHONE-mode OTPs have no SMS
    # integration yet, so they are only visible when this is enabled. Never enable in shared environments.
    console-echo: ${OTP_CONSOLE_ECHO:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${APP_EXPOSE_API_DOCS:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_EXPOSE_API_DOCS:false}
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

