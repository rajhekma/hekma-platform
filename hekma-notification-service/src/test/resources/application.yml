spring:
  application:
    name: hekma-notification-service-test
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false

hekma:
  security:
    service-api-key: test-internal-service-key
  notification:
    channels:
      email:
        provider: mock
        default-sender: no-reply@hekma.com
      sms:
        provider: mock
      push:
        provider: mock
