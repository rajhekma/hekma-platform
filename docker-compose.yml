# Local platform stack for Hekma microservice development.
# Start: ./scripts/local-dev.sh up

services:
  postgres:
    image: postgres:16-alpine
    container_name: hekma-platform-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hekma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hekma_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hekma_platform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hekma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hekma} -d ${POSTGRES_DB:-hekma_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: hekma-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hekma_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-operations_hekma}
      MYSQL_USER: ${MYSQL_USER:-hekma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hekma_local_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - hekma_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-hekma}", "-p${MYSQL_PASSWORD:-hekma_local_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hekma-platform-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hekma_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: hekma-platform-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - hekma_localstack_data:/var/lib/localstack

  ai-usage:
    build: ./hekma-ai-usage
    container_name: hekma-platform-ai-usage
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hekma}:${POSTGRES_PASSWORD:-hekma_local_dev}@postgres:5432/${POSTGRES_DB:-hekma_platform}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://localstack:4566
      AI_USAGE_SQS_ENABLED: "true"
      AI_USAGE_SQS_QUEUE_NAME: ai-usage-recorded
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "${COMMERCE_PORT:-8090}:8090"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  patient-health:
    build: ./hekma-patient-health
    container_name: hekma-platform-patient-health
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-me}
      JWT_ALGORITHM: HS512
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-hekma}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-hekma_local_dev}
      PG_DB: ${POSTGRES_DB:-hekma_platform}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-hekma}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hekma_local_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-operations_hekma}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_REPROCESS_API_KEY: ${CACHE_REPROCESS_API_KEY:-}
    ports:
      - "${PATIENT_HEALTH_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  api-gateway:
    image: nginx:1.27-alpine
    container_name: hekma-platform-gateway
    ports:
      - "${GATEWAY_PORT:-9080}:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-usage:
        condition: service_healthy
      patient-health:
        condition: service_healthy

volumes:
  hekma_pg_data:
  hekma_mysql_data:
  hekma_redis_data:
  hekma_localstack_data:
