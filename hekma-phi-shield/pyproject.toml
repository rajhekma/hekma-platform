[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phi-pii"
version = "1.0.0"
description = "PII Detection API with Anonymization Middleware"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tokenizers>=0.13.0",
    "safetensors>=0.3.0",
    "numpy>=1.24.0",
    "faker>=20.0.0",
    "cryptography>=41.0.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]