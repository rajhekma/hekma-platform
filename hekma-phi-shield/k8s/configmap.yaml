apiVersion: v1
kind: ConfigMap
metadata:
  name: privacy-detection-config
  namespace: privacy-detection
data:
  ENVIRONMENT: "production"
  SERVICE_NAME: "privacy-detection-service"
  SERVICE_HOST: "0.0.0.0"
  SERVICE_PORT: "8080"
  CUSTOM_DOMAIN: "https://pii-phi.hekma.ai"
  STORAGE_BACKEND: "postgresql"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"
  LOG_LEVEL: "INFO"
  PHI_DETECTOR_BACKEND: "openai"
  OPENAI_PHI_MODEL: "gpt-4o-mini"
  OPENAI_TIMEOUT_SECONDS: "45.0"
  KMS_ENABLED: "false"
