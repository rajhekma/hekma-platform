apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privacy-detection-ingress
  namespace: privacy-detection
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - pii-phi.hekma.ai
        - dev-pii-phi.hekma.ai
      secretName: pii-phi-tls-secret
  rules:
    - host: pii-phi.hekma.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privacy-detection-service
                port:
                  number: 8080
    - host: dev-pii-phi.hekma.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privacy-detection-service
                port:
                  number: 8080
