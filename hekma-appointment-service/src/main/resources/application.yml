server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: hekma-appointment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hekma_platform}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: ${FLYWAY_TABLE:appointment_flyway_schema_history}
    baseline-on-migrate: true
    baseline-version: 0

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
      path: /graphiql
    schema:
      introspection:
        enabled: ${GRAPHQL_INTROSPECTION_ENABLED:true}

app:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8080}
    service-key: ${IDENTITY_SERVICE_KEY:13f8fc11-b3b5-4a9e-ab49-06e96a57f42b}
    cache-ttl-seconds: ${IDENTITY_CACHE_TTL_SECONDS:60}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
    service-key: ${NOTIFICATION_SERVICE_KEY:13f8fc11-b3b5-4a9e-ab49-06e96a57f42b}
  security:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    expose-api-docs: ${APP_EXPOSE_API_DOCS:true}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${APP_EXPOSE_API_DOCS:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APP_EXPOSE_API_DOCS:true}
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
