openapi: 3.0.3
info:
  title: Hekma AI Usage
  version: 1.0.0
  description: |
    Patient-level ledger for successful LLM calls. Cost is frozen at ingest.
    Prompts and clinical text are not accepted.
servers:
  - url: http://localhost:8090
paths:
  /health:
    get:
      summary: Process and database health
      operationId: health
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/ai-cost/health:
    get:
      summary: Same health check on the versioned path
      operationId: healthV1
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /internal/v1/ai-usage/events:
    post:
      summary: Price and store one usage event
      operationId: ingestEvent
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEvent"
      responses:
        "200":
          description: Stored or recognized as a duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "422":
          description: Invalid event
  /internal/v1/ai-usage/events:batch:
    post:
      summary: Price and store a list of usage events
      operationId: ingestBatch
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/UsageEvent"
      responses:
        "200":
          description: One result per event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IngestResult"
  /v1/patients/{patient_id}/ai-cost:
    get:
      summary: Token and USD totals for one patient
      operationId: patientCost
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/ApiKey"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Product"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Frozen cost for the half-open period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientCost"
        "400":
          description: Period end is not after the start
  /v1/patients/{patient_id}/ai-cost/events:
    get:
      summary: Individual model calls for one patient
      operationId: patientEvents
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - $ref: "#/components/parameters/ApiKey"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Product"
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
  /v1/ai-cost/prices:
    get:
      summary: Current model price catalog
      operationId: listPrices
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      responses:
        "200":
          description: USD per one million tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceRow"
components:
  parameters:
    ApiKey:
      name: X-API-Key
      in: header
      required: false
      schema:
        type: string
      description: Required only when AI_COST_API_KEY is set on the service.
    PatientId:
      name: patient_id
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Exclusive end of the period.
    Product:
      name: product
      in: query
      schema:
        type: string
        enum: [scan_ai, patient_summary, trial_match]
    TenantId:
      name: tenant_id
      in: query
      schema:
        type: integer
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        database:
          type: string
        sqs:
          type: string
    UsageEvent:
      type: object
      required: [occurred_at, patient_id, product, provider, model]
      properties:
        schema_version:
          type: integer
        request_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          type: integer
        patient_id:
          type: string
        product:
          type: string
          enum: [scan_ai, patient_summary, trial_match]
        feature:
          type: string
        provider:
          type: string
        model:
          type: string
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cached:
          type: boolean
        job_id:
          type: string
        source_service:
          type: string
    IngestResult:
      type: object
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        request_id:
          type: string
          format: uuid
        pricing_status:
          type: string
        cost_usd:
          type: number
    CostBucket:
      type: object
      properties:
        llm_calls:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        cost_usd:
          type: number
        unpriced_calls:
          type: integer
    PatientCost:
      type: object
      properties:
        patient_id:
          type: string
        tenant_id:
          type: integer
        currency:
          type: string
        totals:
          $ref: "#/components/schemas/CostBucket"
        by_product:
          type: array
          items:
            type: object
        by_provider:
          type: array
          items:
            type: object
    EventList:
      type: object
      properties:
        patient_id:
          type: string
        total:
          type: integer
        events:
          type: array
          items:
            type: object
    PriceRow:
      type: object
      properties:
        provider:
          type: string
        model:
          type: string
        input_usd_per_1m:
          type: number
        output_usd_per_1m:
          type: number
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
          nullable: true
